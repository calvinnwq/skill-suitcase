name: Bug report
description: Report a reproducible problem in Skill Suitcase
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Search existing issues first and remove secrets, private prompts, personal data, and contributor-specific paths from all examples.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is a problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence of commands, inputs, or fixture data that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the Skill Suitcase version, Node.js version, package manager version, and operating system.
      placeholder: |
        Skill Suitcase:
        Node.js:
        pnpm or npm:
        Operating system:
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Paste sanitized stdout, stderr, or JSON output. Use a code block when possible.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, private prompts, personal data, and contributor-specific absolute paths.
          required: true
        - label: This is not a security vulnerability. I will use the private process in SECURITY.md for vulnerabilities.
          required: true
