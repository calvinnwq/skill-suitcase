name: Feature request
description: Propose an improvement to Skill Suitcase
title: "feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Start with the user problem and desired outcome. Implementation ideas are welcome after the problem is clear.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult or impossible today, and who encounters it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior or result you want without assuming a particular implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternative designs have you tried?
  - type: textarea
    id: contract
    attributes:
      label: CLI and safety considerations
      description: Note any effects on JSON output, stderr, target writes, approvals, receipts, rollback, or portability.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and documentation for this request.
          required: true
        - label: I removed credentials, private prompts, personal data, and contributor-specific absolute paths.
          required: true
