name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dependency-audit:
    name: dependency-audit
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
      upload-sarif: false
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
      security-events: write

  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm run lint

      - name: Check architecture
        run: pnpm run architecture:check

      - name: Check formatting
        run: pnpm run format:check

  package-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 24
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack and install smoke
        run: pnpm run package:smoke

  test:
    name: test
    if: ${{ always() }}
    needs:
      - dependency-audit
      - verify
      - package-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Confirm required CI gates passed
        env:
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          PACKAGE_SMOKE_RESULT: ${{ needs.package-smoke.result }}
        run: |
          test "$DEPENDENCY_AUDIT_RESULT" = "success"
          test "$VERIFY_RESULT" = "success"
          test "$PACKAGE_SMOKE_RESULT" = "success"
